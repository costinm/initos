name: Nix Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build initos signer
        run: nix build .#initos-signer -o result-signer

      - name: Restore kernel rolling release NAR cache
        continue-on-error: true
        run: |
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/initos-kernel-host.nar" \
            https://github.com/costinm/initos/releases/download/rolling-release/initos-kernel-host.nar
          nix-store --import < "$RUNNER_TEMP/initos-kernel-host.nar"

      - name: Build host kernel
        run: nix build ./linux#kernel-host -o result-kernel-host

      - name: Verify composefs kernel support
        run: |
          kernel_config=result-kernel-host/opt/kernel-image/config
          for setting in \
            CONFIG_EROFS_FS=y \
            CONFIG_EROFS_FS_XATTR=y \
            CONFIG_EROFS_FS_BACKED_BY_FILE=y \
            CONFIG_OVERLAY_FS=y \
            CONFIG_OVERLAY_FS_METACOPY=y \
            CONFIG_FS_VERITY=y
          do
            grep -qx "$setting" "$kernel_config"
          done

      - name: Package artifacts
        run: |
          tar -C result-signer -czf initos-signer.tar.gz .

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: initos-nix-artifacts
          path: |
            initos-signer.tar.gz

      # Always exercise signing. Protected keys are used only for trusted main
      # pushes; all other builds use the conspicuously insecure checked-in keys.
      - name: Prepare signing keys
        env:
          INITOS_SIGNING_KEYS_B64: ${{ secrets.INITOS_SIGNING_KEYS_B64 }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/uefi-keys"
          if [ "${GITHUB_EVENT_NAME}" = push ] && \
             [ "${GITHUB_REF}" = refs/heads/main ] && \
             [ -n "${INITOS_SIGNING_KEYS_B64}" ]; then
            printf '%s' "${INITOS_SIGNING_KEYS_B64}" | base64 --decode | \
              tar -xz -C "$RUNNER_TEMP/uefi-keys" --no-same-owner
            echo "release_signed=true" >> "$GITHUB_ENV"
          else
            cp -a prebuilt/testdata/uefi-keys/. "$RUNNER_TEMP/uefi-keys/"
            echo "release_signed=false" >> "$GITHUB_ENV"
            echo "WARNING: signing with checked-in test keys; outputs are not trusted"
          fi
          find "$RUNNER_TEMP/uefi-keys" -type f -name '*.key' -exec chmod 0600 {} +

      - name: Publish signed firmware source tree to Gitea
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.release_signed == 'true'
        env:
          GITEA_FIRMWARE_SSH_KEY: ${{ secrets.GITEA_FIRMWARE_SSH_KEY }}
          GITEA_KNOWN_HOSTS: ${{ secrets.GITEA_KNOWN_HOSTS }}
        run: |
          test -n "${GITEA_FIRMWARE_SSH_KEY}"
          test -n "${GITEA_KNOWN_HOSTS}"
          deploy_key="$RUNNER_TEMP/gitea-firmware-deploy"
          known_hosts="$RUNNER_TEMP/gitea-known-hosts"
          printf '%s\n' "${GITEA_FIRMWARE_SSH_KEY}" > "$deploy_key"
          printf '%s\n' "${GITEA_KNOWN_HOSTS}" > "$known_hosts"
          chmod 0600 "$deploy_key" "$known_hosts"
          trap 'rm -f "$deploy_key" "$known_hosts"' EXIT
          export GIT_SSH_COMMAND="ssh -i $deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"

          firmware_tree=$(nix build ./linux#firmwareTree --no-link --print-out-paths)
          firmware_repo=target/firmware-publish.git
          firmware_revision=$(sidecar/bin/initos-upgrade firmware-publish \
            "$firmware_tree" "$firmware_repo" refs/heads/firmware)
          remote=git@git.h.webinf.info:costin/initos-firmware.git
          remote_old=$(git ls-remote "$remote" refs/heads/firmware | awk '{print $1}')
          lease="--force-with-lease=refs/heads/firmware:${remote_old}"
          git --git-dir="$firmware_repo" push "$lease" "$remote" \
            "$firmware_revision:refs/heads/firmware" \
            "$firmware_revision:refs/tags/github-${GITHUB_SHA}"
          echo "firmware_git_revision=${firmware_revision}" >> "$GITHUB_ENV"
          chmod -R u+w "$firmware_repo" 2>/dev/null || true
          rm -rf "$firmware_repo"
          rm -f "$deploy_key" "$known_hosts"
          trap - EXIT

      - name: Sign and package release payloads
        env:
          SECRETS: ${{ runner.temp }}/uefi-keys
          REVISION: ${{ github.sha }}
          FIRMWARE_REVISION: ${{ env.firmware_git_revision }}
        run: |
          scripts/build-release.sh target/release

      - name: Remove signing keys
        if: always()
        run: |
          find "$RUNNER_TEMP/uefi-keys" -type f -delete 2>/dev/null || true
          rmdir "$RUNNER_TEMP/uefi-keys" 2>/dev/null || true

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: initos-signed-${{ github.sha }}
          retention-days: 14
          path: |
            target/release/initos-signed-slot.tar.gz
            target/release/SHA256SUMS

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build firmware OCI baseline or bounded delta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.release_signed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo umoci
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lc}/initos-firmware"
          objects=$(nix build ./linux#firmwareImages --no-link --print-out-paths)/objects
          layout=target/firmware-oci
          base_inventory=target/release/firmware-oci-baseline.objects
          current_inventory=target/release/firmware-oci-current.objects

          if curl -fL --retry 3 \
               -o "$base_inventory" \
               https://github.com/${{ github.repository }}/releases/download/signed-rolling/firmware-oci-baseline.objects && \
             skopeo copy "docker://${image}:baseline" "oci:${layout}:baseline"; then
            sidecar/bin/initos-firmware-oci delta \
              "$objects" "$base_inventory" "$layout" baseline current "$current_inventory"
            if sidecar/bin/initos-firmware-oci ratio "$layout" current 20; then
              echo "firmware_oci_rebased=false" >> "$GITHUB_ENV"
            else
              status=$?
              [ "$status" -eq 10 ] || exit "$status"
              chmod -R u+w "$layout" 2>/dev/null || true
              rm -rf "$layout"
              sidecar/bin/initos-firmware-oci baseline \
                "$objects" "$layout" current "$current_inventory"
              cp "$current_inventory" "$base_inventory"
              echo "firmware_oci_rebased=true" >> "$GITHUB_ENV"
            fi
          else
            chmod -R u+w "$layout" 2>/dev/null || true
            rm -rf "$layout"
            sidecar/bin/initos-firmware-oci baseline \
              "$objects" "$layout" current "$current_inventory"
            cp "$current_inventory" "$base_inventory"
            echo "firmware_oci_rebased=true" >> "$GITHUB_ENV"
          fi
          echo "firmware_oci_image=${image}" >> "$GITHUB_ENV"

      - name: Load and Push Docker/OCI images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # dockerTools must materialize its archive in the Nix store, but it
          # can be streamed into Docker without a result link or another copy.
          docker_image=$(nix build .#docker-image --no-link --print-out-paths)
          docker load < "$docker_image"
          docker tag initos-signer:latest "ghcr.io/${owner_lc}/initos-signer:latest"
          docker push "ghcr.io/${owner_lc}/initos-signer:latest"

      - name: Push signed firmware OCI artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.release_signed == 'true'
        run: |
          skopeo copy "oci:target/firmware-oci:current" \
            "docker://${firmware_oci_image}:${GITHUB_SHA}"
          skopeo copy "oci:target/firmware-oci:current" \
            "docker://${firmware_oci_image}:latest"
          if [ "${firmware_oci_rebased}" = true ]; then
            skopeo copy "oci:target/firmware-oci:current" \
              "docker://${firmware_oci_image}:baseline"
          fi


      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-release
          name: Rolling Release
          draft: false
          prerelease: true
          make_latest: true
          files: |
            initos-signer.tar.gz
          body: "Rolling Release containing the InitOS signer for ${{ github.sha }}. Docker image: ghcr.io/costinm/initos-signer:latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Signed Rolling Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.release_signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signed-rolling
          name: Signed Rolling Release
          draft: false
          prerelease: true
          make_latest: false
          files: |
            target/release/initos-signed-slot.tar.gz
            target/release/SHA256SUMS
            target/release/firmware-oci-baseline.objects
            target/release/firmware-oci-current.objects
          body: "Signed InitOS slot payload for ${{ github.sha }}. Firmware CAS: ghcr.io/${{ github.repository_owner }}/initos-firmware:${{ github.sha }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
