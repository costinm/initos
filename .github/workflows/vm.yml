name: VM Kernel Build

on:
  push:
    branches: [ main ]
    paths:
      - 'vm/**'
      - '.github/workflows/vm.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'vm/**'
      - '.github/workflows/vm.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore VM kernel NAR cache
        continue-on-error: true
        run: |
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/initos-kernel-cloud.nar" \
            https://github.com/costinm/initos/releases/download/rolling-release/initos-kernel-cloud.nar
          nix-store --import < "$RUNNER_TEMP/initos-kernel-cloud.nar"

      - name: Build VM kernel (kernel-cloud)
        run: nix build ./vm#kernel-cloud -o result-kernel-cloud

      - name: Build VM tools (hypervisors)
        run: nix build ./vm#vm-tools -o result-vm-tools

      - name: Build VM scripts (initos-init-vm, vrun)
        run: nix build ./vm#vm-scripts -o result-vm-scripts

      - name: Build VM Docker image
        run: nix build ./vm#docker-image -o result-vm-docker-image

      - name: Package VM kernel artifacts
        run: |
          STORE_PATH=$(readlink -f result-kernel-cloud)
          nix-store --export "$STORE_PATH" > initos-kernel-cloud.nar
          tar -C result-kernel-cloud -czf initos-kernel-cloud.tar.gz .

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: initos-vm-artifacts
          path: |
            initos-kernel-cloud.nar
            initos-kernel-cloud.tar.gz

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and Push VM Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker load -i "$(readlink -f result-vm-docker-image)"
          docker tag initos-vm:latest ghcr.io/${owner_lc}/initos-vm:latest
          docker push ghcr.io/${owner_lc}/initos-vm:latest

      - name: Create / Update Rolling Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-release
          name: Rolling Release
          draft: false
          prerelease: true
          make_latest: true
          files: |
            initos-kernel-cloud.nar
            initos-kernel-cloud.tar.gz
          body: "Rolling Release — VM kernel, hypervisors, and init scripts. Docker image: ghcr.io/costinm/initos-vm:latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
